services:
  # PostgreSQL Database
  - type: pserv
    name: chms-postgres
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.postgres
    dockerContext: .
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: church_management
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # NestJS API
  - type: web
    name: chms-api
    env: node
    region: oregon
    plan: starter
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromService:
          type: pserv
          name: chms-postgres
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: chms-postgres
          property: port
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: chms-postgres
          envVarKey: POSTGRES_PASSWORD
      - key: DB_DATABASE
        value: church_management
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
