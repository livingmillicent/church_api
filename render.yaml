services:
  # PostgreSQL Database
  - type: pserv
    name: chms-postgres
    plan: free
    region: oregon

  # NestJS API
  - type: web
    name: chms-api
    env: node
    region: oregon
    plan: free
    branch: develop
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: chms-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
