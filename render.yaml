services:
  # PostgreSQL Database
  - type: pserv
    name: chms-postgres
    plan: free
    region: oregon
    ipAllowList: []

  # NestJS API
  - type: web
    name: chms-api
    env: node
    region: oregon
    plan: free
    branch: develop
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromService:
          type: pserv
          name: chms-postgres
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: chms-postgres
          property: port
      - key: DB_USERNAME
        fromService:
          type: pserv
          name: chms-postgres
          property: user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: chms-postgres
          property: password
      - key: DB_DATABASE
        fromService:
          type: pserv
          name: chms-postgres
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
