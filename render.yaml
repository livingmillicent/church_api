services:
  # NestJS API
  - type: web
    name: chms-api
    runtime: node
    region: oregon
    plan: free
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Ensure devDependencies are installed during build
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d

databases:
  - name: chms-postgres
    plan: free
    region: oregon
